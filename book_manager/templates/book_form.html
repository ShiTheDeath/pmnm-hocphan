{% extends "base.html" %}
{% block title %}{{ 'Sửa' if editing else 'Thêm' }} sách{% endblock %}
{% block content %}
<h1>{{ 'Sửa sách' if editing else 'Thêm sách' }}</h1>
<div class="card form">
  <form method="post">
    <label for="category_id">Danh mục *</label>
    <select id="category_id" name="category_id" required>
      {% for c in cats %}
      <option value="{{ c.id }}" {{ 'selected' if row.get('category_id')|string == c.id|string }}>{{ c.name }}</option>
      {% endfor %}
    </select>
    <label for="title">Tên sách *</label>
    <input id="title" name="title" required maxlength="200" value="{{ row.get('title','') }}">
    <label for="author">Tác giả *</label>
    <input id="author" name="author" required maxlength="100" value="{{ row.get('author','') }}">
    <div class="row2">
      <div><label for="price">Giá (₫)</label>
        <input id="price" name="price" type="number" min="0" step="1000" value="{{ row.get('price', 0) }}"></div>
      <div><label for="quantity">Số lượng</label>
        <input id="quantity" name="quantity" type="number" min="0" value="{{ row.get('quantity', 0) }}"></div>
    </div>
    <label for="year">Năm xuất bản</label>
    <input id="year" name="year" type="number" min="1000" max="2100" value="{{ row.get('year') or '' }}">
    <div class="bar" style="margin-top:16px">
      <button class="btn">Lưu</button>
      <a class="btn sec" href="{{ url_for('books', category_id=row.get('category_id')) }}">Hủy</a>
    </div>
  </form>
</div>
{% endblock %}
