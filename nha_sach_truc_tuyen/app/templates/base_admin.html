<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quản trị{% endblock %} · Nhà sách Sông Hương</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f8fb; }
    .sidebar { background: #1b2437; min-height: 100vh; }
    .sidebar .nav-link { color: #c9d3e6; border-radius: .5rem; }
    .sidebar .nav-link.active, .sidebar .nav-link:hover { background: #2d3a55; color: #fff; }
    .badge-count { background: #f97316; }
    .stat-num { font-size: 1.9rem; font-weight: 700; }
    .bar-wrap { height: 120px; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <aside class="col-md-2 sidebar p-3">
      <div class="text-white fw-semibold">Quản trị</div>
      <div class="small text-secondary mb-3">Nhà sách Sông Hương</div>
      {% set ep = request.endpoint %}
      <ul class="nav flex-column gap-1">
        <li><a class="nav-link {{ 'active' if ep == 'admin.dashboard' }}" href="{{ url_for('admin.dashboard') }}">▣ Tổng quan</a></li>
        <li><a class="nav-link {{ 'active' if ep in ('admin.books','admin.book_new','admin.book_edit') }}" href="{{ url_for('admin.books') }}">📚 Sách</a></li>
        <li><a class="nav-link {{ 'active' if ep in ('admin.categories','admin.category_edit') }}" href="{{ url_for('admin.categories') }}">🏷 Danh mục</a></li>
        <li><a class="nav-link {{ 'active' if ep in ('admin.orders','admin.order_detail') }}" href="{{ url_for('admin.orders') }}">🧾 Đơn hàng
          {% if pending_count %}<span class="badge rounded-pill badge-count ms-1">{{ pending_count }}</span>{% endif %}</a></li>
      </ul>
      <div class="mt-5"><a class="nav-link text-secondary" href="{{ url_for('shop.book_list') }}">← Trang bán hàng</a></div>
    </aside>

    <main class="col-md-10 p-4">
      {% from '_macros.html' import flashes %}
      {{ flashes() }}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
