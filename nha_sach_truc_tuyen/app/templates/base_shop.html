<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nhà sách Sông Hương{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar-shop { background: #0b3a73; }
    .badge-cart { background: #f97316; }
    .price { color: #ea580c; font-weight: 600; }
    body { background: #f6f8fb; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark navbar-shop mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('shop.book_list') }}">📖 Nhà sách Sông Hương</a>
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('shop.book_list') }}">Sách</a></li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('shop.cart_view') }}">🛒 Giỏ hàng
            {% if cart_count %}<span class="badge rounded-pill badge-cart" id="cart-badge">{{ cart_count }}</span>{% endif %}
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container pb-5">
    {% from '_macros.html' import flashes %}
    {{ flashes() }}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
