<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --error-color: #dc2626;
            --error-bg: #fef2f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .card-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .card-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3.5px rgba(2, 132, 199, 0.15);
        }

        input.is-invalid {
            border-color: var(--error-color);
            background-color: var(--error-bg);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.825rem;
            margin-top: 6px;
            font-weight: 500;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        button:hover {
            background-color: #0369a1;
        }

        /* Khung hiển thị kết quả theo màu sắc */
        .result-card {
            margin-top: 24px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid transparent;
        }

        /* Màu xanh: Bình thường */
        .result-card.green {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        /* Màu vàng: Thiếu cân / Thừa cân */
        .result-card.yellow {
            background-color: #fefce8;
            border-color: #fef08a;
            color: #d8d515;
        }

        /* Màu đỏ: Béo phì */
        .result-card.red {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #d82020;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .ideal-weight {
            font-size: 0.875rem;
            margin-top: 8px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>Tính Chỉ Số BMI</h2>
            <p>Đánh giá thể trạng theo chuẩn Châu Á</p>
        </div>
        
        <form action="" method="POST">
            <!-- Chiều cao -->
            <div class="form-group">
                <label for="height">Chiều cao (cm):</label>
                <input type="text" id="height" name="height" value="{{ height }}" placeholder="Ví dụ: 170 hoặc 165,5" class="{% if error_height %}is-invalid{% endif %}">
                {% if error_height %}
                    <div class="error-message"> {{ error_height }}</div>
                {% endif %}
            </div>

            <!-- Cân nặng -->
            <div class="form-group">
                <label for="weight">Cân nặng (kg):</label>
                <input type="text" id="weight" name="weight" value="{{ weight }}" placeholder="Ví dụ: 65 hoặc 65,5" class="{% if error_weight %}is-invalid{% endif %}">
                {% if error_weight %}
                    <div class="error-message"> {{ error_weight }}</div>
                {% endif %}
            </div>

            <button type="submit">Tính BMI</button>
        </form>

        {% if bmi %}
            <div class="result-card {{ color_type }}">
                <div class="result-title">{{ bmi }} - {{ category }}</div>
                <div class="ideal-weight">Nên có: <strong>{{ ideal_weight_str }}</strong></div>
            </div>
        {% endif %}
    </div>

</body>
</html>
